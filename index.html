<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery Cloud | Mochrks</title>
    <meta
      name="description"
      content="A stunning photo gallery showcasing photography, artwork, and design collections by Mochrks."
    />
    <!-- favicon -->
    <link rel="shortcut icon" href="assets/photos/favicon1.png" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Background Effects -->
    <div class="noise-overlay"></div>

    <!-- DotField Background -->
    <div class="dot-field-container" id="dotField" aria-hidden="true">
      <canvas id="dotFieldCanvas"></canvas>
      <svg id="dotFieldSvg">
        <defs>
          <radialGradient id="dotGlowGrad">
            <stop offset="0%" stop-color="#0d6efd" stop-opacity="0.18" />
            <stop offset="100%" stop-color="transparent" />
          </radialGradient>
        </defs>
        <circle id="dotGlowCircle" cx="-9999" cy="-9999" r="160"
          fill="url(#dotGlowGrad)" style="opacity:0;will-change:opacity" />
      </svg>
    </div>

    <div class="container">
      <!-- Header -->
      <header class="header" id="header">
        <h1 class="sr-only">Photo Gallery Cloud</h1>
        <div class="tech-text" id="techText" role="img" aria-label="Photo Gallery Cloud">
          <canvas class="tech-text-canvas" id="techTextCanvas"></canvas>
        </div>
        <p class="header-subtitle">
          Personal visual archive by <a href="https://mochrks.my.id" target="_blank" rel="noopener">mochrks.my.id</a>
          — a curated collection of photography, digital artwork &amp; creative design work.
        </p>
        <div class="header-line"></div>
      </header>

      <!-- Stats -->
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-number" id="statTotal">0</div>
          <div class="stat-label">Total Items</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="statLoaded">0</div>
          <div class="stat-label">Loaded</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="statCategories">3</div>
          <div class="stat-label">Categories</div>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-section" id="filterSection"></div>

      <!-- Gallery Grid -->
      <div class="gallery-grid" id="galleryGrid"></div>

      <!-- Loader -->
      <div class="loader" id="loader">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="loader-text" id="loaderText">Loading more images...</div>

      <!-- End Message -->
      <div class="end-message" id="endMessage">
        <div class="end-line"></div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p>© 2026 <a href="#">Mochrks</a> — All rights reserved.</p>
      </footer>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
      <button class="lightbox-close" id="lightboxClose">&times;</button>
      <button class="lightbox-nav lightbox-prev" id="lightboxPrev">
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button class="lightbox-nav lightbox-next" id="lightboxNext">
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <div class="lightbox-content" id="lightboxContent">
        <img id="lightboxImg" src="" alt="Lightbox image" />
      </div>
      <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>

    <!-- Scroll to Top -->
    <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">
      <svg viewBox="0 0 24 24">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>

    <script>
      // ===== DotField Vanilla JS Engine =====
      (function () {
        const container = document.getElementById('dotField');
        const canvas    = document.getElementById('dotFieldCanvas');
        const glowCircle = document.getElementById('dotGlowCircle');
        if (!container || !canvas) return;

        const ctx = canvas.getContext('2d', { alpha: true });
        if (!ctx) return;

        // ---- Config ----
        const DOT_RADIUS     = 1.5;
        const DOT_SPACING    = 14;
        const CURSOR_RADIUS  = 500;
        const BULGE_STRENGTH = 67;
        const GRADIENT_FROM  = 'rgba(13, 110, 253, 0.55)';
        const GRADIENT_TO    = 'rgba(13, 202, 240, 0.35)';

        const dpr    = Math.min(window.devicePixelRatio || 1, 2);
        const TWO_PI = Math.PI * 2;

        let dots = [], w = 0, h = 0, frameCount = 0, raf = null;
        const mouse = { x: -9999, y: -9999, prevX: -9999, prevY: -9999, speed: 0 };
        let glowOpacity = 0, engagement = 0;

        // ---- Build dot grid ----
        function buildDots(width, height) {
          const step = DOT_RADIUS + DOT_SPACING;
          const cols = Math.floor(width  / step);
          const rows = Math.floor(height / step);
          const padX = (width  % step) / 2;
          const padY = (height % step) / 2;
          dots = [];
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const ax = padX + col * step + step / 2;
              const ay = padY + row * step + step / 2;
              dots.push({ ax, ay, sx: ax, sy: ay });
            }
          }
        }

        // ---- Resize: use window dimensions (container is position:fixed) ----
        function doResize() {
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width  = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          canvas.style.width  = w + 'px';
          canvas.style.height = h + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          buildDots(w, h);
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(doResize, 100);
        });

        // ---- Mouse ----
        window.addEventListener('mousemove', e => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        }, { passive: true });

        setInterval(() => {
          const dx = mouse.prevX - mouse.x;
          const dy = mouse.prevY - mouse.y;
          const d  = Math.sqrt(dx * dx + dy * dy);
          mouse.speed += (d - mouse.speed) * 0.5;
          if (mouse.speed < 0.001) mouse.speed = 0;
          mouse.prevX = mouse.x;
          mouse.prevY = mouse.y;
        }, 20);

        // ---- Render loop ----
        function tick() {
          frameCount++;
          const len  = dots.length;
          const crSq = CURSOR_RADIUS * CURSOR_RADIUS;
          const rad  = DOT_RADIUS / 2;

          const targetEng = Math.min(mouse.speed / 5, 1);
          engagement += (targetEng - engagement) * 0.06;
          if (engagement < 0.001) engagement = 0;

          glowOpacity += (engagement - glowOpacity) * 0.08;
          if (glowCircle) {
            glowCircle.setAttribute('cx', String(mouse.x));
            glowCircle.setAttribute('cy', String(mouse.y));
            glowCircle.style.opacity = String(glowOpacity);
          }

          ctx.clearRect(0, 0, w, h);
          const grad = ctx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, GRADIENT_FROM);
          grad.addColorStop(1, GRADIENT_TO);
          ctx.fillStyle = grad;

          ctx.beginPath();
          for (let i = 0; i < len; i++) {
            const d  = dots[i];
            const dx = mouse.x - d.ax;
            const dy = mouse.y - d.ay;
            const distSq = dx * dx + dy * dy;

            if (distSq < crSq && engagement > 0.01) {
              const dist  = Math.sqrt(distSq);
              const tt    = 1 - dist / CURSOR_RADIUS;
              const push  = tt * tt * BULGE_STRENGTH * engagement;
              const angle = Math.atan2(dy, dx);
              d.sx += (d.ax - Math.cos(angle) * push - d.sx) * 0.15;
              d.sy += (d.ay - Math.sin(angle) * push - d.sy) * 0.15;
            } else {
              d.sx += (d.ax - d.sx) * 0.1;
              d.sy += (d.ay - d.sy) * 0.1;
            }

            ctx.moveTo(d.sx + rad, d.sy);
            ctx.arc(d.sx, d.sy, rad, 0, TWO_PI);
          }
          ctx.fill();
          raf = requestAnimationFrame(tick);
        }

        document.addEventListener('visibilitychange', () => {
          if (document.hidden) { cancelAnimationFrame(raf); raf = null; }
          else if (!raf) raf = requestAnimationFrame(tick);
        });

        // Wait one rAF so layout is complete before measuring
        requestAnimationFrame(() => {
          doResize();
          raf = requestAnimationFrame(tick);
        });
      })();

      // ===== FoldText Vanilla JS Engine =====
      (function () {
        const FOLD_TEXT    = 'mochrks.my.id \u2014 Visual Archive';
        const HINGE        = 'top';      // top | bottom | left | right
        const DURATION     = 0.65;       // seconds per character
        const STAGGER      = 0.045;      // delay between chars
        const PERSPECTIVE  = 700;        // px
        const CREASE       = 0.55;       // 0–1 shadow strength
        const TRIGGER      = 'loop';     // mount | hover | loop

        const HINGE_CONFIG = {
          top:    { origin: '50% 0%',   rotateX: -92, rotateY: 0  },
          bottom: { origin: '50% 100%', rotateX:  92, rotateY: 0  },
          left:   { origin: '0% 50%',   rotateX: 0,   rotateY: 92 },
          right:  { origin: '100% 50%', rotateX: 0,   rotateY: -92 }
        };

        const cfg = HINGE_CONFIG[HINGE];
        const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const visual = document.querySelector('#foldBadge .fold-text-visual');
        if (!visual) return;

        // Build char spans
        const chars = Array.from(FOLD_TEXT);
        const pieces = [];
        chars.forEach(char => {
          const seg = document.createElement('span');
          seg.className = 'fold-text-segment';
          seg.dataset.foldSplit = 'char';
          seg.style.setProperty('--fold-perspective', `${PERSPECTIVE}px`);

          const piece = document.createElement('span');
          piece.className = 'fold-text-piece';
          piece.dataset.foldHinge = HINGE;
          piece.style.transformOrigin = cfg.origin;
          piece.style.setProperty('--fold-crease', '0');
          piece.textContent = char === ' ' ? '\u00A0' : char;

          seg.appendChild(piece);
          visual.appendChild(seg);
          pieces.push(piece);
        });

        // Minimal CSS-transition based animator (no GSAP dependency)
        const lerp = (a, b, t) => a + (b - a) * t;
        const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

        // Each piece animates via Web Animations API — widely supported, no deps
        const animatePieces = (repeat) => {
          const activeDur    = reducedMotion ? Math.min(DURATION, 0.22) : DURATION;
          const activeStagger = reducedMotion ? Math.min(STAGGER, 0.02) : STAGGER;
          const rX = reducedMotion ? 0 : cfg.rotateX;
          const rY = reducedMotion ? 0 : cfg.rotateY;
          const crease = reducedMotion ? 0 : CREASE;

          // Cancel any running animations
          pieces.forEach(p => { try { p.getAnimations().forEach(a => a.cancel()); } catch(e){} });

          const totalDur = (activeDur + activeStagger * (pieces.length - 1)) * 1000;
          const repeatDelay = repeat ? 750 : 0;

          pieces.forEach((piece, i) => {
            const delay = i * activeStagger * 1000;
            const keyframes = [
              { opacity: 0, transform: `rotateX(${rX}deg) rotateY(${rY}deg)`, '--fold-crease': crease },
              { opacity: 1, transform: 'rotateX(0deg) rotateY(0deg)',          '--fold-crease': 0    }
            ];
            const opts = {
              duration: activeDur * 1000,
              delay,
              easing: reducedMotion ? 'ease' : 'cubic-bezier(0.215, 0.61, 0.355, 1)',
              fill: 'both',
              iterations: repeat ? Infinity : 1
            };

            if (repeat) {
              // For loop: chain play → wait → restart via JS timing
              opts.iterations = 1;
              const runCycle = (extraDelay) => {
                const anim = piece.animate(keyframes, { ...opts, delay: delay + extraDelay });
                anim.onfinish = () => {
                  setTimeout(() => runCycle(0), repeatDelay + (pieces.length - 1 - i) * activeStagger * 1000);
                };
              };
              runCycle(0);
            } else {
              piece.animate(keyframes, opts);
            }
          });
        };

        if (TRIGGER === 'hover') {
          // Start visible, animate on mouseenter
          pieces.forEach(p => { p.style.opacity = '1'; p.style.transform = 'none'; });
          document.getElementById('badgeWrap').addEventListener('mouseenter', () => animatePieces(false));
        } else if (TRIGGER === 'loop') {
          animatePieces(true);
        } else {
          // mount
          animatePieces(false);
        }
      })();

      // ===== TechText Vanilla JS Engine =====
      (function () {
        const TEXT        = 'Photo Gallery Cloud';
        const FONT_WEIGHT = 700;
        const FONT_SIZE   = 150;
        const LETTER_SPC  = -0.03;
        const COLOR       = '#ffffff';
        const ACCENT      = '#0d6efd';
        const REACH       = 220;
        const SOFTNESS    = 0.7;
        const DASH_LEN    = 4;
        const DASH_GAP    = 2;
        const STROKE_W    = 1.5;
        const LINE_STYLE  = 'dashed'; // 'dashed' | 'solid'
        const REVEAL      = 'letter'; // 'area' | 'letter' | 'off'
        const SPECKS      = 15;
        const DRAGGABLE   = true;
        const SWEEP       = true;
        const SPEED       = 1;
        const FALLOFF_STEPS = 8;
        const SPRING = 320, DAMPING = 22;
        const LABEL_FONT = '10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

        const container = document.getElementById('techText');
        const canvas    = document.getElementById('techTextCanvas');
        if (!container || !canvas) return;
        const ctx = canvas.getContext('2d');
        const scratch = document.createElement('canvas');
        const scratchCtx = scratch.getContext('2d');
        if (!ctx || !scratchCtx) return;

        const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        let width = 1, height = 1, dpr = 1;
        let raf = 0, last = performance.now();
        let visible = true, alive = true;
        let layoutKey = '', word = null, glyphs = [];
        let presence = 0, clock = 0, pulse = 0, placed = false;
        let dragging = -1;
        const pointer = { x: 0, y: 0, inside: false };
        const grab = { x: 0, y: 0 };
        const lens  = { x: 0, y: 0 };
        const frame = { x1: 0, y1: 0, x2: 0, y2: 0, alpha: 0, index: -1 };

        const approach = (cur, tgt, dt, sec) => cur + (tgt - cur) * (1 - Math.exp(-dt / sec));

        const hexToRgb = (hex) => {
          let h = String(hex || '').replace('#', '');
          if (h.length === 3) h = h.replace(/./g, c => c + c);
          const n = parseInt(h.slice(0, 6), 16);
          return isNaN(n) ? [255, 255, 255] : [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        };
        const rgba = (hex, alpha) => {
          const [r, g, b] = hexToRgb(hex);
          return `rgba(${r},${g},${b},${alpha})`;
        };
        const noise = (...vals) => {
          let h = 2166136261;
          for (const v of vals) {
            h = Math.imul(h ^ (v | 0), 16777619);
            h ^= h >>> 13;
            h = Math.imul(h, 0x5bd1e995);
            h ^= h >>> 15;
          }
          return (h >>> 0) / 4294967296;
        };
        const signed = v => v > 0 ? `+${v}` : v < 0 ? `\u2212${-v}` : '0';
        const crisp  = v => (Math.round(v * dpr) + 0.5) / dpr;

        const fontStr = (size) => `${FONT_WEIGHT} ${size}px 'Space Grotesk','Plus Jakarta Sans',sans-serif`;
        const setFont = (c, size) => {
          c.font = fontStr(size);
          if ('letterSpacing' in c) c.letterSpacing = `${LETTER_SPC * size}px`;
          c.textAlign = 'left';
          c.textBaseline = 'alphabetic';
        };

        const makeSprite = (view, glyph, stroke) => {
          const pad  = Math.ceil(STROKE_W * 2 + 4);
          const left = glyph.box.x1 - pad;
          const top  = glyph.box.y1 - pad;
          const w    = glyph.box.x2 - glyph.box.x1 + pad * 2;
          const h    = glyph.box.y2 - glyph.box.y1 + pad * 2;
          const img  = document.createElement('canvas');
          img.width  = Math.max(1, Math.ceil(w * dpr));
          img.height = Math.max(1, Math.ceil(h * dpr));
          const c = img.getContext('2d');
          if (!c) return { image: img, left, top };
          c.setTransform(dpr, 0, 0, dpr, -left * dpr, -top * dpr);
          setFont(c, view.size);
          if (stroke) {
            c.lineJoin = 'round'; c.lineWidth = STROKE_W * 2; c.lineCap = 'butt';
            c.strokeStyle = COLOR;
            if (LINE_STYLE !== 'solid') c.setLineDash([Math.max(1, DASH_LEN), Math.max(1, DASH_GAP)]);
            c.strokeText(glyph.char, glyph.x, view.baseline);
            c.setLineDash([]);
            c.globalCompositeOperation = 'destination-out';
            c.fillStyle = '#000000';
            c.fillText(glyph.char, glyph.x, view.baseline);
            c.globalCompositeOperation = 'source-over';
          } else {
            c.fillStyle = COLOR;
            c.fillText(glyph.char, glyph.x, view.baseline);
          }
          return { image: img, left, top };
        };

        const ensureLayout = () => {
          const key = [TEXT, FONT_WEIGHT, FONT_SIZE, LETTER_SPC, COLOR, DASH_LEN, DASH_GAP, STROKE_W, LINE_STYLE, width, height, dpr].join('|');
          if (key === layoutKey && word) return word;
          layoutKey = key;

          const probe = scratchCtx;
          setFont(probe, FONT_SIZE);
          let m = probe.measureText(TEXT);
          const fit = Math.min(
            1,
            (width * 0.9) / Math.max(m.actualBoundingBoxLeft + m.actualBoundingBoxRight, 1),
            (height * 0.66) / Math.max(m.actualBoundingBoxAscent + m.actualBoundingBoxDescent, 1)
          );
          const size = FONT_SIZE * fit;
          setFont(probe, size);
          m = probe.measureText(TEXT);
          const inkW = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
          const inkH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
          const x = (width - inkW) / 2 + m.actualBoundingBoxLeft;
          const baseline = (height - inkH) / 2 + m.actualBoundingBoxAscent;

          const next = {
            size, baseline,
            left:   x - m.actualBoundingBoxLeft,
            right:  x + m.actualBoundingBoxRight,
            top:    baseline - m.actualBoundingBoxAscent,
            bottom: baseline + m.actualBoundingBoxDescent
          };
          word = next;

          const prev = glyphs;
          glyphs = [];
          let prefix = '';
          Array.from(TEXT).forEach((char, i) => {
            prefix += char;
            const own = probe.measureText(char);
            const gx  = x + probe.measureText(prefix).width - own.width;
            if (!char.trim()) return;
            const base = {
              char, x: gx,
              box: {
                x1: gx - own.actualBoundingBoxLeft,
                y1: baseline - own.actualBoundingBoxAscent,
                x2: gx + own.actualBoundingBoxRight,
                y2: baseline + own.actualBoundingBoxDescent
              }
            };
            const kept = prev[glyphs.length];
            glyphs.push({
              ...base,
              offset:   kept && kept.char === char ? kept.offset : { x: 0, y: 0 },
              velocity: { x: 0, y: 0 },
              outline: 0, index: i,
              fill:   makeSprite(next, base, false),
              dashes: makeSprite(next, base, true)
            });
          });
          dragging = -1;
          frame.index = -1;
          return next;
        };

        const glyphAt = (px, py) => {
          if (!word || py < word.top - 24 || py > word.bottom + 24) return -1;
          let best = -1, bestD = Infinity;
          glyphs.forEach((g, i) => {
            const x1 = g.box.x1 + g.offset.x, x2 = g.box.x2 + g.offset.x;
            const d  = px < x1 ? x1 - px : px > x2 ? px - x2 : 0;
            if (d < bestD) { bestD = d; best = i; }
          });
          return bestD < 28 ? best : -1;
        };

        const falloff = (c, cx, cy, radius, strength, softness) => {
          const inner = Math.min(1, Math.max(0, 1 - softness));
          const g = c.createRadialGradient(cx, cy, 0, cx, cy, radius);
          g.addColorStop(0, `rgba(0,0,0,${strength})`);
          if (inner > 0.995) {
            g.addColorStop(0.995, `rgba(0,0,0,${strength})`);
            g.addColorStop(1, 'rgba(0,0,0,0)');
            return g;
          }
          for (let i = 0; i <= FALLOFF_STEPS; i++) {
            const t = i / FALLOFF_STEPS;
            const e = t * t * (3 - 2 * t);
            g.addColorStop(inner + (1 - inner) * t, `rgba(0,0,0,${strength * (1 - e)})`);
          }
          return g;
        };

        const blit = (c, art, dx, dy, ox, oy) => {
          c.drawImage(art.image,
            Math.round((art.left + dx) * dpr - ox),
            Math.round((art.top  + dy) * dpr - oy)
          );
        };

        const drawReveal = () => {
          const radius = REACH * dpr, cx = lens.x * dpr, cy = lens.y * dpr;
          ctx.globalCompositeOperation = 'destination-out';
          ctx.fillStyle = falloff(ctx, cx, cy, radius, presence, SOFTNESS);
          ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
          ctx.globalCompositeOperation = 'source-over';

          const x0 = Math.max(0, Math.floor(cx - radius));
          const y0 = Math.max(0, Math.floor(cy - radius));
          const x1 = Math.min(canvas.width, Math.ceil(cx + radius));
          const y1 = Math.min(canvas.height, Math.ceil(cy + radius));
          if (x1 <= x0 || y1 <= y0) return;
          const w = x1 - x0, h = y1 - y0;
          if (scratch.width < w || scratch.height < h) {
            scratch.width  = Math.max(scratch.width, w);
            scratch.height = Math.max(scratch.height, h);
          }
          scratchCtx.setTransform(1, 0, 0, 1, 0, 0);
          scratchCtx.globalCompositeOperation = 'source-over';
          scratchCtx.clearRect(0, 0, w, h);
          for (const g of glyphs) blit(scratchCtx, g.dashes, g.offset.x, g.offset.y, x0, y0);
          scratchCtx.globalCompositeOperation = 'destination-in';
          scratchCtx.fillStyle = falloff(scratchCtx, cx - x0, cy - y0, radius, 1, SOFTNESS);
          scratchCtx.fillRect(0, 0, w, h);
          scratchCtx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = presence;
          ctx.drawImage(scratch, 0, 0, w, h, x0, y0, w, h);
          ctx.globalAlpha = 1;

          if (d < h) return [frame.x2, frame.y1 + d, 1, 0];

            const size = pick < 0.46 ? 2 : pick < 0.7 ? 3 : pick < 0.84 ? 5 : pick < 0.94 ? 8 : 11;

            const alpha = a * (large ? 0.3 + 0.4 * tone : 0.3 + 0.6 * tone) * blink;

          all: `<svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="1.2em" width="1.2em" xmlns="http://www.w3.org/2000/svg"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"></path></svg> All`,
          photo: `<svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="1.2em" width="1.2em" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="3.2"></circle><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"></path></svg> Photos`,
          artwork: `<svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="1.2em" width="1.2em" xmlns="http://www.w3.org/2000/svg"><path d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S15.67 9 16.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"></path></svg> Artwork`,
          design: `<svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="1.2em" width="1.2em" xmlns="http://www.w3.org/2000/svg"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96a.996.996 0 0 0 0-1.41z"></path></svg> Design`,
        };

        Object.keys(filterLabels).forEach((key) => {
          const btn = document.createElement("button");
          btn.className = "filter-btn" + (key === "all" ? " active" : "");
          btn.dataset.filter = key;
          btn.innerHTML = `${filterLabels[key]}<span class="filter-count">${categories[key]}</span>`;
          btn.addEventListener("click", () => handleFilter(key));
          filterSection.appendChild(btn);
        });

        function handleFilter(filter) {
          if (filter === currentFilter) return;
          currentFilter = filter;

          // Update active button
          document.querySelectorAll(".filter-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.filter === filter);
          });

          // Reset & filter
          filteredImages =
            filter === "all"
              ? [...uniqueImages]
              : uniqueImages.filter((i) => i.category === filter);

          nextIndex = 0;
          loadedCount = 0;
          renderedItems = [];
          galleryGrid.innerHTML = "";
          loader.style.display = "flex";
          loaderText.style.display = "block";
          endMessage.style.display = "none";
          statLoaded.textContent = "0";

          loadImages(initialLoad);
        }

        // ===== Create Gallery Item =====
        function createGalleryItem(imgData, globalIndex, delay) {
          const item = document.createElement("div");
          item.className = "gallery-item";
          item.style.animationDelay = delay + "ms";
          item.classList.add("animate-in");

          const img = document.createElement("img");
          img.loading = "lazy";
          img.decoding = "async";
          img.alt = `${imgData.category} image ${globalIndex + 1}`;

          // Use IntersectionObserver for true lazy loading
          img.dataset.src = imgData.src;

          img.addEventListener("load", function () {
            this.classList.add("visible");
            item.classList.add("loaded");
          });

          img.addEventListener("error", function () {
            item.style.display = "none";
          });

          // Overlay
          const overlay = document.createElement("div");
          overlay.className = "overlay";
          overlay.innerHTML = `
            <div class="overlay-content">
              <div class="overlay-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                </svg>
              </div>
            </div>
          `;

          item.appendChild(img);
          item.appendChild(overlay);

          // Click for lightbox
          item.addEventListener("click", () => {
            openLightbox(renderedItems.indexOf(imgData));
          });

          return item;
        }

        // ===== Lazy Load Images via IntersectionObserver =====
        const imgObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const img = entry.target;
                if (img.dataset.src) {
                  img.src = img.dataset.src;
                  img.removeAttribute("data-src");
                  imgObserver.unobserve(img);
                }
              }
            });
          },
          { rootMargin: "300px 0px", threshold: 0 },
        );

        // ===== Load Images =====
        function loadImages(count) {
          if (isLoading) return;
          isLoading = true;

          const endIndex = Math.min(nextIndex + count, filteredImages.length);

          if (nextIndex >= filteredImages.length) {
            loader.style.display = "none";
            loaderText.style.display = "none";
            endMessage.style.display = "block";
            isLoading = false;
            return;
          }

          const fragment = document.createDocumentFragment();

          for (let i = nextIndex; i < endIndex; i++) {
            const delay = (i - nextIndex) * 50; // stagger
            const item = createGalleryItem(filteredImages[i], i, delay);
            fragment.appendChild(item);
            renderedItems.push(filteredImages[i]);

            // Observe the img for lazy src loading
            const img = item.querySelector("img");
            if (img) imgObserver.observe(img);
          }

          requestAnimationFrame(() => {
            galleryGrid.appendChild(fragment);
            nextIndex = endIndex;
            loadedCount = nextIndex;
            statLoaded.textContent = loadedCount;
            isLoading = false;

            if (nextIndex >= filteredImages.length) {
              loader.style.display = "none";
              loaderText.style.display = "none";
              endMessage.style.display = "block";
            }
          });
        }

        // ===== Initial Load =====
        loadImages(initialLoad);

        // ===== Infinite Scroll via IntersectionObserver =====
        if ("IntersectionObserver" in window) {
          const scrollObserver = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting && !isLoading) {
                  loadImages(batchSize);
                }
              });
            },
            { root: null, rootMargin: "400px", threshold: 0.1 },
          );
          scrollObserver.observe(loader);
        } else {
          // Fallback with throttle
          let scrollTimeout;
          window.addEventListener("scroll", function () {
            if (scrollTimeout) return;
            scrollTimeout = setTimeout(() => {
              if (
                window.innerHeight + window.scrollY >=
                document.body.offsetHeight - 600
              ) {
                loadImages(batchSize);
              }
              scrollTimeout = null;
            }, 150);
          });
        }

        // ===== Lightbox =====
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxClose = document.getElementById("lightboxClose");
        const lightboxPrev = document.getElementById("lightboxPrev");
        const lightboxNext = document.getElementById("lightboxNext");
        const lightboxCounter = document.getElementById("lightboxCounter");
        let currentLightboxIndex = 0;

        function openLightbox(index) {
          if (index < 0 || index >= renderedItems.length) return;
          currentLightboxIndex = index;
          lightboxImg.src = renderedItems[index].src;
          lightboxCounter.textContent = `${index + 1} / ${renderedItems.length}`;
          lightbox.classList.add("active");
          document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
          lightbox.classList.remove("active");
          document.body.style.overflow = "";
          setTimeout(() => {
            lightboxImg.src = "";
          }, 300);
        }

        function navigateLightbox(direction) {
          let newIndex = currentLightboxIndex + direction;
          if (newIndex < 0) newIndex = renderedItems.length - 1;
          if (newIndex >= renderedItems.length) newIndex = 0;
          currentLightboxIndex = newIndex;
          lightboxImg.style.opacity = "0";
          setTimeout(() => {
            lightboxImg.src = renderedItems[newIndex].src;
            lightboxImg.onload = () => {
              lightboxImg.style.opacity = "1";
            };
            lightboxCounter.textContent = `${newIndex + 1} / ${renderedItems.length}`;
          }, 150);
        }

        lightboxClose.addEventListener("click", closeLightbox);
        lightboxPrev.addEventListener("click", () => navigateLightbox(-1));
        lightboxNext.addEventListener("click", () => navigateLightbox(1));
        lightbox.addEventListener("click", (e) => {
          if (e.target === lightbox) closeLightbox();
        });

        // Keyboard navigation
        document.addEventListener("keydown", (e) => {
          if (!lightbox.classList.contains("active")) return;
          if (e.key === "Escape") closeLightbox();
          if (e.key === "ArrowLeft") navigateLightbox(-1);
          if (e.key === "ArrowRight") navigateLightbox(1);
        });

        // ===== Scroll to Top =====
        const scrollTopBtn = document.getElementById("scrollTop");
        let scrollTicking = false;

        window.addEventListener("scroll", () => {
          if (!scrollTicking) {
            requestAnimationFrame(() => {
              scrollTopBtn.classList.toggle("visible", window.scrollY > 500);
              scrollTicking = false;
            });
            scrollTicking = true;
          }
        });

        scrollTopBtn.addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    </script>
  </body>
